  <text x="560" y="80" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">DESIGN GOALS</text>
  <text x="560" y="125" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">01</text>
  <text x="604" y="126" font-size="16" fill="#0a0a0a">Run it yourself, in your own Cloudflare account.</text>
  <line x1="560" y1="152" x2="1140" y2="152" stroke="#e0e0e0" stroke-width="1"/>
  <text x="560" y="183" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">02</text>
  <text x="604" y="184" font-size="16" fill="#0a0a0a">Nothing else to host or look after.</text>
  <line x1="560" y1="210" x2="1140" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <text x="560" y="241" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">03</text>
  <text x="604" y="242" font-size="16" fill="#0a0a0a">Fill in the week, submit it, get it approved.</text>
  <line x1="560" y1="268" x2="1140" y2="268" stroke="#e0e0e0" stroke-width="1"/>
  <text x="560" y="299" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">04</text>
  <text x="604" y="300" font-size="16" fill="#0a0a0a">Your data exports to common formats, any time.</text>
  <line x1="560" y1="326" x2="1140" y2="326" stroke="#e0e0e0" stroke-width="1"/>
  <text x="560" y="357" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">05</text>
  <text x="604" y="358" font-size="16" fill="#0a0a0a">Committed to being open source.</text>

