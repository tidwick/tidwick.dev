version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
      astro:
        patterns: ["astro", "@astrojs/*"]
        update-types: [major]
    ignore:
      # Remove when @astrojs/check's typescript peer range includes 7
      # (^5 || ^6 at @astrojs/check 0.9.x).
      - dependency-name: typescript
        versions: [">=7"]
