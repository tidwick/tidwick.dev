# No logic here: every step is a `just` recipe, so CI runs what a laptop runs. Actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.11
          cache: true
      - run: just ci
      - name: Live site answers
        if: github.event_name == 'schedule'
        run: curl --fail --silent --show-error --max-time 30 --output /dev/null https://tidwick.dev/
